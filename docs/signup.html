<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign up - test-hq</title>
</head>
<body>
  <h1>Create your account</h1>
  <form id="signup">
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" minlength="8" required></label>
    <button type="submit">Sign up</button>
  </form>
  <p id="result" role="status"></p>
  <p>After signing up, <a id="continue" href="welcome.html">continue to your workspace</a>.</p>
  <script type="module">
    import { signupStep } from "./lib/signup.js";
    document.getElementById("signup").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const step = signupStep({
        email: data.get("email"),
        password: data.get("password"),
      });
      const box = document.getElementById("result");
      box.textContent = step.message;
      box.dataset.state = step.ok ? "created" : "failed";
      if (step.ok && step.next) location.assign(step.next);
    });
  </script>
</body>
</html>
