<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout - test-hq</title>
</head>
<body>
  <h1>Checkout</h1>
  <table id="cart">
    <tbody id="cart-lines"></tbody>
  </table>
  <form id="checkout">
    <label>Discount code <input name="code" autocomplete="off"></label>
    <button type="submit">Pay</button>
  </form>
  <p id="total"></p>
  <p id="notice" role="status"></p>
  <script type="module">
    import { cartTotal, discountPercent } from "./lib/cart.js";
    import { formatCents } from "./lib/format.js";

    const items = [{ name: "Team plan (5 seats)", cents: 10000, quantity: 1 }];

    const lines = document.getElementById("cart-lines");
    const total = document.getElementById("total");
    const notice = document.getElementById("notice");

    const renderLines = () => {
      lines.replaceChildren(
        ...items.map((item) => {
          const row = document.createElement("tr");
          const name = document.createElement("td");
          name.textContent = item.name;
          const price = document.createElement("td");
          price.textContent = formatCents(item.cents * item.quantity);
          row.append(name, price);
          return row;
        }),
      );
    };

    const renderTotal = (code) => {
      total.textContent = `Total: ${formatCents(cartTotal(items, code))}`;
      const trimmed = String(code ?? "").trim();
      notice.textContent =
        trimmed && discountPercent(trimmed) === 0 ? `Discount code "${trimmed}" is not valid` : "";
    };

    renderLines();
    renderTotal("");

    document.getElementById("checkout").addEventListener("submit", (event) => {
      event.preventDefault();
      renderTotal(new FormData(event.target).get("code"));
    });
  </script>
</body>
</html>
