<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invite a teammate - test-hq</title>
</head>
<body>
  <h1>Invite a teammate</h1>
  <form id="invite">
    <label>Teammate email <input type="email" name="email" required></label>
    <button type="submit">Send invite</button>
  </form>
  <p id="result" role="status"></p>
  <script type="module">
    import { sendInvite } from "./lib/invite.js";
    document.getElementById("invite").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = new FormData(event.target).get("email");
      const box = document.getElementById("result");
      box.textContent = "Sending invite…";
      const { ok, message } = await sendInvite(email, ["owner@test-hq.example"]);
      box.textContent = message;
      box.dataset.state = ok ? "sent" : "failed";
    });
  </script>
</body>
</html>
